---
# cPanel Git Version Control deployment.
# In cPanel: Git Version Control -> Manage -> Pull or Deploy ->
#   "Update from Remote", then "Deploy HEAD Commit".
# Only the website files are copied; README, .gitignore and this file stay out of the web folder.
#
# DEPLOYPATH must be the document root of greenmindproject.eu.
# Check it in cPanel -> Domains. If the domain shows a different document root
# (for example /home/USER/greenmindproject.eu), change the line below to match.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R index.html favicon.svg og-image.png css js $DEPLOYPATH
